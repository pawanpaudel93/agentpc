name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to a master commit (the README says pinned SHAs must be on master), so the
      # toolchain is named explicitly; @stable meant the same.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)
      # The runner image ships Node and npm; the plugin validation needs the claude CLI.
      - name: Tools
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          npm install -g @anthropic-ai/claude-code@2.1.285
      # The same checks release.sh runs before it builds.
      - run: scripts/check.sh
      - run: cargo build --locked --release

  # The helpers Linux guests install, tested against stubs with the guests' shells: dash
  # (Ubuntu's /bin/sh) and bash (Arch's).
  guest-helpers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: dash scripts/test-guest-helpers.sh
      - run: bash scripts/test-guest-helpers.sh
