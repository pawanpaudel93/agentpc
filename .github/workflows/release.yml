name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64)
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "$VERSION" = "$CARGO_VERSION" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $CARGO_VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET"
          # Stripping can drop the linker's ad-hoc signature; arm64 macOS refuses unsigned binaries.
          codesign --force --sign - "target/$TARGET/release/agentpc"
          "target/$TARGET/release/agentpc" --version

      - name: Package tarball
        run: |
          NAME="agentpc-$VERSION-$TARGET"
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/agentpc" LICENSE README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - name: Package MCP bundle # npx: Node is preinstalled on GitHub macOS runners
        run: |
          mkdir -p bundle/server
          jq --arg v "$VERSION" '.version = $v' packaging/mcpb/manifest.json > bundle/manifest.json
          cp "target/$TARGET/release/agentpc" bundle/server/agentpc
          cp LICENSE README.md bundle/
          npx -y @anthropic-ai/mcpb@2 validate bundle/manifest.json
          npx -y @anthropic-ai/mcpb@2 pack bundle "dist/agentpc-$VERSION.mcpb"
          (cd dist && shasum -a 256 "agentpc-$VERSION.mcpb" > "agentpc-$VERSION.mcpb.sha256")

      - name: Fill server.json for the MCP Registry
        run: |
          MCPB_SHA=$(awk '{print $1}' "dist/agentpc-$VERSION.mcpb.sha256")
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq --arg v "$VERSION" --arg url "$BASE/agentpc-$VERSION.mcpb" --arg sha "$MCPB_SHA" \
            '.version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > dist/server.json

      - uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.mcpb
            dist/*.mcpb.sha256
            dist/server.json
