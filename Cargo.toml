[package]
name = "agentpc"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
description = "Instant, resettable Windows, Ubuntu and Arch Linux ARM desktop VMs for AI agents on Apple Silicon Macs (CLI + MCP server)"
license = "MIT"
repository = "https://github.com/pawanpaudel93/agentpc"
homepage = "https://github.com/pawanpaudel93/agentpc"
readme = "README.md"
keywords = ["mcp", "qemu", "virtual-machine", "ai-agents", "computer-use"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4"
futures = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "json", "query"] }
rmcp = { version = "3.4.1", features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
