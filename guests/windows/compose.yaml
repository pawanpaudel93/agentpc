name: agentpc-windows

services:
  windows:
    image: dockurr/windows-arm
    container_name: agentpc-windows
    environment:
      VERSION: "11"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
      # Throwaway local VM; ports below bind to 127.0.0.1 only.
      USERNAME: "agent"
      PASSWORD: "agent"
      # Appended to dockur's `-cpu host`.
      CPU_FLAGS: "${CPU_FLAGS:-}"
    devices:
      - /dev/kvm
      - /dev/net/tun
    # Without NET_ADMIN QEMU silently falls back to user-mode networking and
    # the published ports never reach the guest.
    cap_add:
      - NET_ADMIN
    ports:
      - 127.0.0.1:8006:8006   # web viewer
      - 127.0.0.1:3389:3389   # RDP
      - 127.0.0.1:2222:22     # OpenSSH
      - 127.0.0.1:8000:8000   # Windows-MCP (streamable-http)
    volumes:
      - storage:/storage
      - ./oem:/oem
    stop_grace_period: 2m

volumes:
  storage:
